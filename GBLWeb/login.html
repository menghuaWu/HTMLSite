<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="utf-8">

	<meta name="viewport" content="width=device-width, initial-scale=1">

</head>

<body>
	<!-- Modal -->
	<div class="modal fade " id="loginModal" role="dialog" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered modal-lg" role="document">
			<div class="modal-content">
				<div class="modal-header" style="background-color:whitesmoke;cursor: move;">

					<h5 class="modal-title">使用者登入</h5>
				</div>
				<div class="modal-body" >

					<form action="">
						<fieldset>
						<div class="form-group row  ">
							<div class="col input-group">
								<div class="input-group-prepend">
									<span class="input-group-text bg-white ">User Name: </span>
								</div>
								<input type="text" class="form-control " id="username" placeholder="Enter username"
									autocomplete="off" required>

							</div>
						</div>
						<div class="form-group row  ">
							<div class="col input-group">
								<div class="input-group-prepend ">
									<span class="input-group-text bg-white ">Password: </span>
								</div>
								<input type="password" class="form-control " id="pwd" placeholder="Enter password"
									autocomplete="off" required>

							</div>
						</div>

						<div class="form-group row  " id="company-row">
							<div class="col input-group">
								<div class="input-group-prepend">
									<span class="input-group-text bg-white ">Company:</span>
								</div>
								<select id="company" class="form-control">
									
								</select>

							</div>
						</div>
						<div class="form-group row  " id="domain-row">
							<div class="col input-group">
								<div class="input-group-prepend">
									<span class="input-group-text bg-white ">WorkArea:</span>
								</div>
								<select id="domain" class="form-control">
									
								</select>

							</div>
						</div>
						
						<div class="form-group row  " id="selLanguage-row">
							<div class="col input-group">
								<div class="input-group-prepend">
									<span class="input-group-text bg-white ">Language:</span>
								</div>
								<select id="selLanguage" class="form-control">
									
								</select>

							</div>
						</div>
						<div class="form-group row  " id="Printer-row">
							<div class="col input-group">
								<div class="input-group-prepend">
									<span class="input-group-text bg-white ">Printer:</span>
								</div>
								<select id="Printer" class="form-control">
									

								</select>

							</div>
						</div>
						<div class="form-group row form-check px-5" >
							<input type="checkbox" class="form-check-input" id="remember">
							<label class="form-check-label" for="remember">Remember Me</label>
						</div>
						<div class="form-group row form-check px-5" id="dataSource-row">
							<input type="checkbox" class="form-check-input" id="dataSource">
							<label class="form-check-label" for="dataSource">打勾表選用(訓練用)資料環境。</label>
						</div>
						<div class="form-group  row form-check px-5" id="ledType-row">
							<input type="checkbox" class="form-check-input" id="ledType">
							<label class="form-check-label" for="ledType">打勾表選用LED不亮。</label>
						</div>
					</fieldset>
					</form>


				</div>

				<div class="modal-footer">
					<span id="message"></span>
					<button type="button" class="btn btn-info" id="btn_login">Submit</button>
				</div>

			</div>
		</div>
	</div>
	<!---------------------------Load   include File-------------------- -->

	<script type="text/javascript" src="/GBLWeb/Module/js/global.js"></script>
	<script type="text/javascript" src="/GBLWeb/API/jquery-ui-1.13.3.Shake Effect/jquery-ui.min.js"></script>
	<script type="text/javascript" src="/GBLWeb/login/login.js"></script>


</body>

</html>
