    <script>    
		var autthToken="";
		var siteInvoke = {"DBSWeb":"invoke","DPSWeb":"invoke2","SFCWeb":"invoke3","RMAWeb":"invoke4","WMSWeb":"invoke5"}
		var browseURL =  document.location.href;		
		var pathURL = browseURL.replace(document.location.origin,"").substring(1);
		var siteName = pathURL.substring(0,pathURL.indexOf("/"));		
		var baseURL = document.location.origin + "/MES/";
		var invokeURL = baseURL + siteInvoke[siteName]+"?sCode=";	
		autthToken = getcooky("token");        
		if(autthToken!=""){
			$.ajaxSetup({
				headers : {
					'Authorization' : 'Bearer ' + autthToken
				}
			});
			bllogin = true;
		}else{				  
			document.location.href = "login.html?cb=index.html";
		}
		function getcooky(name){
			var x = document.cookie;
			var c_array = x.split(";");
			var retVal="";
			for(var i = 0;i<c_array.length;i++){
			  	if(c_array[i].trim().indexOf(name+"=")==0){
			  		retVal = c_array[i].substring(c_array[i].indexOf("=")+1);
			  		break;
			  	}
			}
  			return retVal;
		}
      
		function chkHaveSQLVar(webapi){
			var vars=0;
			$.ajax({
			    type: "POST",
			    contentType: "application/json; charset=utf-8",
			    url: invokeURL+"ChkHaveSQLVar",
			    dataType: "json",
			    data : JSON.stringify({p:webapi}) ,
			    async:false,
				success: function (JSONdata) {
					if(JSONdata.length>0){
						vars = JSONdata[0].COUNT;
					}
				}
			});
			return vars;
		}
      
		function goapi(api){
			$(".templatemo-content-container").css({'height':($(window).height()-$(".templatemo-top-nav-container").height()-30)+'px'});
			var sqlvar = 0;
			sqlvar = chkHaveSQLVar(api);
			var querydiv = "";
			var contentdiv = "";
			if(sqlvar>0){
			  //querydiv = "<div class='templatemo-content-widget white-bg col-2'></div>";
			}
			contentdiv += "<div class='templatemo-flex-row flex-content-row'>";
			contentdiv += "<div class='templatemo-content-widget white-bg col-2'>";
			contentdiv += "<iframe id='frmgrid2' src='grid.html?api="+api+"' frameborder='0' scrolling='no'></iframe>";        
			contentdiv += "</div>";
			contentdiv += "</div>";       
			$(".templatemo-content-container").html(querydiv+contentdiv);
			$("iframe[id^='frmgrid']").load(function(){
				$(this).width($(this).closest("div").width()-5); //resize iframe
				var curHeight = $(this).contents().find('body').height();
				//$(this).height(curHeight-5);
				$(this).height("325px");
			});
			$("button[name^='btnDetail']").click(function(){
				document.location.href = "grid.html?api="+this.name.substring(this.name.indexOf("-")+1);
			});
		}

		function reSizeX(){
			//resize embeded iframe width
			$("#frmgrid").width($("#frmgrid").closest("div").width()-5);
			//resize grid
			document.getElementById("frmgrid").contentWindow.reSizejqGridWidth();
		}

		$(document).ready(function(){
			$(window).on("resize", reSizeX);       
		});

    </script>
