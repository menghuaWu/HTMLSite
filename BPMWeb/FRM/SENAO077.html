          <div class="card-body">

            <div class="row m-0 p-0">

                  <input type="text" class="form-control " id="senao077003" name="senao077003" autocomplete="off">
                  <div class="input-group-append">
                    <button type="button" class="btn btn-secondary " id="senao077003_b1" name="senao077003_b1">...</button>
                  </div>
                  <div class=" input-group-text bg-white formLabelClass d-none"> 
                    <span id="lbl_senao077005">lbl_senao077005</span>

              <div class="col-md-6 ">

                  </div>
                </div>
              </div>
              -->

                    <span class="input-group-text bg-white formLabelClass" id="lbl_senao077010">表單名稱</span>
                  </div>
                  <input type="text" class="form-control " id="senao077010" name="senao077010" autocomplete="off">
                  <div class="input-group-append">
                    <button type="button" class="btn btn-secondary " id="senao077010_b1" name="senao077010_b1">...</button>
                  </div>
                </div>
              </div>            
            </div> 
            <!------------------------------------row 3-------------------------------------------->
            <div class="row m-0 p-0">
              <div class="col-md-6 ">
                <div class="input-group mb-3">
                  <div class=" input-group-prepend">
                    <span class="input-group-text bg-white formLabelClass" id="lbl_senao077011">表單單號</span>
                  </div>
                  <input type="text" class="form-control " id="senao077011" name="senao077011" autocomplete="off">

            </div> 
            <!------------------------------------row 4-------------------------------------------->
            <div class="row m-0 p-0">
              <div class="col-md">
                <div class="input-group mb-3">

                    <span class="input-group-text bg-white formLabelClass" id="lbl_senao077012">注意事項</span>

                  <input type="text" class="form-control " id="senao077012" name="senao077012" autocomplete="off">

              </div>            
            </div>

            <div class="row m-0 p-0">
              <div class="col-md">
